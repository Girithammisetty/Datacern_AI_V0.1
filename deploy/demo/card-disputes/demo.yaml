# BRD 70 demo bundle manifest (§2.2). Bound explicitly to `pack` +
# `pack_version` (not "whatever's currently installed") so this bundle is
# reproducible independent of what the product pack has moved on to since —
# the same discipline packs/<pack>'s own dataset_bindings use at install
# time. Never installed by `packctl install` — only by
# packs/demo_seed_runner.py (BRD 70 SeedDemoContent step) and validated
# offline by `packctl demo-lint`.
demo_manifest: 1
pack: card-disputes
pack_version: 2.1.0
version: 1.0.0
provenance: >
  All rows are synthetic, hand-authored for this demo bundle (a small,
  narratively-linked subset in the same shape as
  deploy/demo/card_disputes/gen_demo_data.py's larger generated book — same
  binding-contract columns, same dispute-type/reason-code vocabulary).
  Cardholder names, account/transaction/dispute identifiers, merchants, and
  dollar amounts are fictional (no real PII, no real BINs or PANs, no real
  merchant accounts). Generated 2026-07-26 for the card-disputes demo
  bundle, mirroring the BRD 70 (Demo Sandbox & POC Mode) bundle format
  insurance-claims-payer already ships.
