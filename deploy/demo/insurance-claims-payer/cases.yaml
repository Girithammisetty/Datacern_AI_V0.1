# Open-row seed cases (§2.2): the 5 PENDING prior-auth requests become the
# demo tenant's worklist (mirrors PAR-5001..5005 in data/prior_auth_requests.csv
# — pa_review_triage is the pack's real triage decision table, so these are
# the same rows a live payer's PA queue would surface). row_pk resolves
# against prior_auth_requests' first required_columns entry (par_id) —
# checked by `packctl demo-lint`.
- dataset: prior_auth_requests
  row_pk: PAR-5001
  severity: high
  display_projection:
    member_id: MBR-10501
    requested_service: lumbar_fusion
    cpt_code: "22633"
    urgency: urgent
  note: >
    Urgent lumbar fusion PA, 4h in queue. Clinical info complete; copilot
    recommends approve at 0.88 confidence — spinal-fusion criteria met per
    submitted imaging + failed 6-week conservative care note.
