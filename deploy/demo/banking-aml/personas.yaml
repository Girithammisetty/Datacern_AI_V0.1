# Demo-persona set (§2.2), generalizing packs/MULTITENANT_LOGINS.md's
# per-pack role cheat-sheet into a seedable object. Four personas covering
# the same four-eyes walkthrough shape as insurance-claims-payer's and
# card-disputes' bundles (worklist -> triage -> approval -> audit), mapped
# 1:1 to banking-aml/rbac/roles.yaml's role names so each persona's login
