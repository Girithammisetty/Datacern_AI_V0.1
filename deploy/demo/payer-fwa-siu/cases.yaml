# Open-row seed cases (§2.2): the 5 NEW leads become the demo tenant's
# worklist (mirrors LED-8001..8005 in data/fwa_leads.csv — siu_lead_triage
# is the pack's real deterministic routing table, so these are the same rows
# a live payer's SIU intake queue would surface, and the same dispositions
# siu_lead_triage.yaml's rules would propose, in rule order). Five more rows
# (LED-7940..7880) exist only in the CSV, already closed or referred, to
# give the KPI dashboards and the audit-trail step real history to show —
# they are deliberately NOT queued here. row_pk resolves against fwa_leads'
# first required_columns entry (lead_id) — checked by `packctl demo-lint`.
- dataset: fwa_leads
  row_pk: LED-8001
  severity: critical
  display_projection:
    provider_npi: "1955010002"
    provider_specialty: psychiatry
    fwa_typology: impossible_day
    fwa_score: 0.93
    exposure_amount: 168000.00
  note: >
    siu_lead_triage rule 1 (priority=critical): a behavioral-health provider
    billed 27 units of 90837 (60-minute psychotherapy) on a single date of
    service — 27 hours of billed therapy time in one day, over the "per se
    impossible" 24-hour line in the pack's own grounding. Routes straight to
    the investigator queue; the copilot never asserts fraud intent — only
    investigators and counsel determine that.
- dataset: fwa_leads
  row_pk: LED-8002
  severity: high
  display_projection:
    provider_npi: "1955010009"
    provider_specialty: podiatry
    fwa_typology: phantom_billing
    lead_source: member_complaint
    exposure_amount: 41000.00
  note: >
    siu_lead_triage rule 2 (lead_source=member_complaint): a human allegation
    always gets investigator review regardless of score — allegations are
    never score-filtered away. Two members independently show identical
    same-day nail-debridement billing (CPT 11721) they deny receiving; a
    credible phantom-billing allegation can itself trigger a state Medicaid
    payment-suspension referral, so it routes with two-signature discipline.
- dataset: fwa_leads
  row_pk: LED-8003
  severity: high
  display_projection:
    provider_npi: "1955010003"
    provider_specialty: durable_medical_equipment
    lead_source: leie_refresh
    leie_status: excluded
    exposure_amount: 58000.00
  note: >
    siu_lead_triage rule 3 (lead_source=leie_refresh): this DME supplier
    newly appeared on the OIG exclusion list — an exclusion hit is among the
    strongest single evidence items in a case packet. Routes to investigator
    review of pending and recently paid claims on this provider; the table
    never converts an exclusion hit into an automatic recoupment.
- dataset: fwa_leads
  row_pk: LED-8004
  severity: high
  display_projection:
    provider_npi: "1955010001"
    provider_specialty: internal_medicine
    fwa_typology: upcoding
    fwa_score: 0.88
    exposure_amount: 76000.00
  note: >
    siu_lead_triage rule 4 (fwa_score >= 0.85 AND exposure_amount >=
    $50,000): the detection pipeline tagged this lead priority=medium, but
    the triage table's own score+exposure floor overrides that to HIGH —
    this provider bills E/M level 5 on 61% of visits against a peer baseline
    of 5-15%. The table re-assesses the queue priority; it does not just
    echo the field it was handed.
- dataset: fwa_leads
  row_pk: LED-8005
  severity: low
  display_projection:
    provider_npi: "1955010007"
    provider_specialty: pain_management
    fwa_typology: kickback_referral_scheme
    fwa_score: 0.42
    exposure_amount: 2100.00
  note: >
    siu_lead_triage rule 6 (fwa_score < 0.6 AND exposure_amount < $5,000):
    a weak data-mining signal on a referral-heavy provider, below the
    plan-configured floor for investigator time. The table refuses to guess
    at intent from a thin pattern — it proposes pend_evidence, holding the
    lead on the data-mining watch for corroboration instead of opening an
    investigation or clearing it outright.
