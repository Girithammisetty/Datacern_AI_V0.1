{{- /* Shared ServiceAccount. Cloud workload-identity annotations come from values.

This is a pre-install HOOK, at a weight below both job hooks, and it has to be.
bootstrap-job.yaml (weight -10) and migrate-job.yaml (weight -5) both set
serviceAccountName to this account, and hooks run before ordinary resources — so
as a plain template it did not exist yet when they ran, and every fresh install
died in pre-install with

  Error creating: pods "agent-runtime-migrate-" is forbidden: error looking up
  service account datacern-sa: serviceaccount "datacern-sa" not found

surfacing to the operator only as `Job ... not ready ... context deadline
exceeded`, because the Job object is created fine and simply never gets a pod.
Weight -20 puts it ahead of both.

hook-delete-policy is before-hook-creation ONLY — deliberately not
hook-succeeded. The account must outlive the hooks: deployment.yaml references
it too, so deleting it on success would break every pod the moment the install
finished. */}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "datacern.serviceAccountName" . }}
  labels:
    {{- include "datacern.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
