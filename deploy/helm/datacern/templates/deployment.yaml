{{- /* One Deployment per entry in .Values.services (mirrors deploy/services.yaml). */}}
{{- $root := . -}}
{{- range $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svc.name }}
  labels:
    {{- include "datacern.labels" $root | nindent 4 }}
    {{- include "datacern.selectorLabels" (dict "svc" $svc "root" $root) | nindent 4 }}
spec:
  {{- /*
  global.replicaOverride collapses every service to the same replica count,
  for single-node targets where the per-service defaults do not fit. Most
  services default to 2, which on one 8-vCPU node sums to cpu 8 (100%) of
  requests once the data tier is also resident — and that produces a deadlock
  rather than a slowdown: new pods cannot schedule ("Insufficient cpu"), old
  pods are not removed because the new ones never become Ready, and the
  pre-upgrade migrate hook cannot schedule either, so helm blocks until its
  timeout with no progress possible.
  Unset on every hyperscaler profile, so their per-service replicas stand.
  */}}
  replicas: {{ $root.Values.global.replicaOverride | default $svc.replicas | default 1 }}
  {{- if eq (int ($root.Values.global.replicaOverride | default 0)) 1 }}
  {{- /*
  Single-node profiles also need Recreate. The default RollingUpdate surges a
  second pod per service during any upgrade or config roll, which doubles the
  footprint on a node sized for exactly one of everything: the surge pod sits
  Pending on "Insufficient cpu" (or starves the node into probe failures)
  while the old pod stays — observed on the GCP demo VM as "duplicate pods"
  and a wedged rollout. Recreate swaps in place; a brief per-service gap is
  the right trade on a demo node. Cloud profiles keep rolling updates.
  */}}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "datacern.selectorLabels" (dict "svc" $svc "root" $root) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "datacern.labels" $root | nindent 8 }}
        {{- include "datacern.selectorLabels" (dict "svc" $svc "root" $root) | nindent 8 }}
      annotations:
        # Roll pods when the non-secret config changes.
        checksum/config: {{ toYaml $root.Values.config | sha256sum }}
    spec:
      serviceAccountName: {{ include "datacern.serviceAccountName" $root }}
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $root.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $svc.name }}
          image: {{ include "datacern.image" (dict "svc" $svc "root" $root) }}
          imagePullPolicy: {{ default "IfNotPresent" $root.Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          envFrom:
            - configMapRef:
                name: datacern-config
            - secretRef:
                name: {{ $root.Values.secrets.name }}
          {{- /*
          The Go services read LISTEN_ADDR and default to :8080, while the
          probes and Service target $svc.port — so without this line all nine
          of them bind the wrong port and can never pass readiness (found on
          the first real GCP rollout: identity/rbac probe-killed forever on
          8301/8302 while listening on 8080). Set unconditionally: services
          that don't read it ignore it, and one line here beats nine env
          entries in values.yaml that the next service would forget to copy.
          env below wins over envFrom, and $svc.env entries win over nothing —
          this sits in the always-rendered env list so every service gets it.
          */}}
          {{- /* Per-service env: maps the exact var names THIS service reads
                 (Go = unprefixed DATABASE_URL/REDIS_ADDR/KAFKA_BROKERS; Python =
                 <PREFIX>_ names) to the shared/per-service secret + config keys.
                 env wins over envFrom, so each service gets its own DB DSN. */}}
          env:
            - name: LISTEN_ADDR
              value: ":{{ $svc.port }}"
            {{- with $svc.env }}
            {{- toYaml . | nindent 12 }}
            {{- /* B9 HA ClickHouse: audit-service only, opt-in, additive to the
                   CLICKHOUSE_ADDR/USER/PASSWORD env above. Both .Values.clickhouse
                   keys default empty/false, so a default install renders neither
                   line and CLICKHOUSE_ADDR-only single-node behavior is
                   unchanged. See values.yaml's clickhouse: section header. */}}
            {{- if eq $svc.name "audit-service" }}
            {{- if $root.Values.clickhouse.addrs }}
            - name: CLICKHOUSE_ADDRS
              value: {{ join "," $root.Values.clickhouse.addrs | quote }}
            {{- end }}
            {{- if $root.Values.clickhouse.replicated }}
            - name: CLICKHOUSE_REPLICATED
              value: "true"
            {{- end }}
            {{- end }}
          {{- end }}
          startupProbe:
            httpGet:
              path: {{ include "datacern.readyPath" (dict "svc" $svc) }}
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: {{ include "datacern.readyPath" (dict "svc" $svc) }}
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ include "datacern.livePath" (dict "svc" $svc) }}
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml (default $root.Values._resourceTiers.small $svc.resources) | nindent 12 }}
          securityContext:
            {{- /* A service may override the whole block (booleans don't merge cleanly). */}}
            {{- toYaml (default $root.Values.securityContext $svc.securityContext) | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with $svc.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- with $svc.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
