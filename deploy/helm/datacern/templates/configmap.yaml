{{- /* datacern-config — non-secret settings consumed by every Deployment.

A pre-install hook for the same reason serviceaccount.yaml is one: migrate-job
and bootstrap-job are pre-install hooks that load this map wholesale via

    envFrom:
      - configMapRef:
          name: datacern-config

and hooks run before ordinary resources. As a plain template it did not exist
when they ran, so every migrate pod died in CreateContainerConfigError with
`configmap "datacern-config" not found` — retried five times a minute, so the
Job stayed Running and Helm reported only `Job in progress` until the timeout.

Weight -20 alongside the ServiceAccount: both must exist before the -10 bootstrap
job. hook-delete-policy is before-hook-creation only — every Deployment reads
this map too, so it has to outlive the hooks that triggered its creation.

Note the sibling secret.yaml needs no such treatment: it renders only when
secrets.create=true, and on every path where it does not, datacern-secrets is
created out-of-band before the chart is installed. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: datacern-config
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
  labels:
    {{- include "datacern.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
