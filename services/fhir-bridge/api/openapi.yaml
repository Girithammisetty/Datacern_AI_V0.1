openapi: 3.0.3
info:
  title: fhir-bridge
  description: >
    Stateless FHIR R4 proxy: per-tenant registry of external FHIR backends
    (Epic / Cerner / OpenEMR / HAPI-class) plus a connectivity probe. Proxied
    resource access (read/search/create/update) is NOT exposed here — agents
    reach it exclusively through the tool-plane, which federates to the
    internal MCP facade (POST /internal/v1/mcp/invoke). No PHI is stored; no
    response bodies are logged.
  version: 0.1.0
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /fhir-backends:
    post:
      summary: Register a FHIR backend (action fhir.backend.create)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBackendRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackendData'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    get:
      summary: List the tenant's FHIR backends (action fhir.backend.list)
      responses:
        '200':
          description: Tenant-scoped backend list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Backend'
  /fhir-backends/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get one backend (action fhir.backend.read)
      responses:
        '200':
          description: Backend
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackendData'
        '404': { $ref: '#/components/responses/Error' }
    patch:
      summary: Update a backend; optional secret rotates the Vault entry (action fhir.backend.update)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchBackendRequest'
      responses:
        '200':
          description: Updated backend
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackendData'
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: Delete a backend (row + best-effort Vault delete; action fhir.backend.delete)
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Error' }
  /fhir-backends/{id}/test:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: >
        Connectivity probe: GET {base_url}/metadata (CapabilityStatement) with
        the backend's auth attached (action fhir.backend.read). The upstream
        body is never relayed.
      responses:
        '200':
          description: Probe result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ok: { type: boolean }
                      status: { type: integer }
                      fhir_version: { type: string, example: 4.0.1 }
                      latency_ms: { type: integer }
                      error: { type: string }
        '404': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: Master error envelope (MASTER-FR-024)
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string }
                  message: { type: string }
                  trace_id: { type: string }
  schemas:
    Secret:
      type: object
      description: >
        Write-only secret material. Persisted ONLY in Vault at
        secret/data/tenants/{tenant}/fhir-backends/{id}; never stored in
        Postgres, never returned by any endpoint.
      properties:
        token: { type: string, description: bearer }
        username: { type: string, description: basic }
        password: { type: string, description: basic }
        client_secret: { type: string, description: oauth2_client_credentials }
        private_key_pem: { type: string, description: smart_backend_services (RS384 signing key) }
        kid: { type: string, description: smart_backend_services JWKS key id }
    Backend:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        base_url: { type: string }
        auth_method:
          type: string
          enum: [none, bearer, basic, oauth2_client_credentials, smart_backend_services]
        token_url: { type: string }
        client_id: { type: string }
        scopes: { type: string, example: system/*.read }
        vault_ref: { type: string }
        status: { type: string, enum: [active, disabled] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BackendData:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Backend'
    CreateBackendRequest:
      type: object
      required: [name, base_url, auth_method]
      properties:
        name: { type: string }
        base_url: { type: string }
        auth_method:
          type: string
          enum: [none, bearer, basic, oauth2_client_credentials, smart_backend_services]
        token_url: { type: string, description: required for oauth2/smart }
        client_id: { type: string, description: required for oauth2/smart }
        scopes: { type: string }
        workspace_id: { type: string, format: uuid }
        secret:
          $ref: '#/components/schemas/Secret'
    PatchBackendRequest:
      type: object
      properties:
        name: { type: string }
        base_url: { type: string }
        auth_method: { type: string }
        token_url: { type: string }
        client_id: { type: string }
        scopes: { type: string }
        status: { type: string, enum: [active, disabled] }
        secret:
          $ref: '#/components/schemas/Secret'
