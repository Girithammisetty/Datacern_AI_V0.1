# insurance-claims-payer capability pack (BRD 24) — Core-neutral edition:
# AI-assisted prior-auth review, appeal analysis, and denial analytics for US
# health payers. Installable TODAY against Datacern Core's public APIs via
# packctl/pack-service; the manifest envelope follows BRD 23 (PKG-FR-001/003).
# Components the current Core cannot materialize are declared under `deferred`
# — recorded in the install ledger, never faked.
# v2.0.0 (no-dummy-data rule): the pack ships ZERO seed data — datasets are
# binding CONTRACTS resolved to the tenant's REAL data at install; cases arrive
# from real rows via case triggers/intake, not seeds; eval golden sets are
# curated by the tenant from its own adjudicated history.
# v2.1.0 (audited depth rework): fabricated plan-history grounding removed;
# SME-depth triage instructions; PA/appeal decision tables extended (overdue
# escalation, missing-clinical-info deferral, CO-151/PR-204 appeal routes);
# turnaround grounding extended with CMS-0057-F, which carries the
# 72h-expedited / 7-day-standard prior-auth windows to Medicaid, CHIP, and
# FFE QHP issuers (compliance from Jan 1 2026; PA API phased 2026-2027).
pack_manifest: 1
name: insurance-claims-payer
version: 2.1.0
publisher: { id: pub-datacern, name: "Datacern Inc." }
description: >-
  AI-assisted prior-auth review, appeal analysis, and denial analytics for US
  health payers: payer KPI semantic models, three dashboards, typed PA/appeal
  case schemas with dispositions, deterministic PA-triage and appeal-routing
  decision tables, payer domain ontology, payer role catalog, domain-grounded
  copilot configuration with guardrails, governed source/write-back
  connections (X12 837 intake, claim-status sync), and a PA-approval training
  pipeline with its governed model blueprint.
categories: [insurance, health, payer, claims, prior-auth, appeals, denials]
regulatory: [cms_4201_f, cms_0057_f, cms_2024_ma_ai_review, naic_ai_bulletin, hipaa]
# Regulatory/framework CONTROL MAPPINGS (A6). MAPPING AID ONLY — see the
# disclaimer below and PACK_AUTHORING_GUIDE.md "Control mappings". Every
# `implemented` entry was verified against the cited code before being
# written; `not_covered` entries record an honest gap instead of a claim.
control_mappings:
  disclaimer: >-
    These control mappings identify specific Datacern platform controls that
    support obligations named in EU AI Act, NIST AI RMF, and ISO/IEC 42001
    provisions. They are a MAPPING AID for the tenant's own compliance
    program — NOT a certification, attestation, audit finding, or legal
    determination that this pack or the platform is compliant with any
    regulation or standard. Whether a given framework applies to a specific
    tenant/deployment is the tenant's own determination; consult qualified
    counsel. Entries with status "not_covered" document a known gap, not an
    implemented control.
  mappings:
    - framework: eu_ai_act
      control_id: art_12
      control_title: "Article 12 — Record-keeping (automatic logging)"
      platform_control: >-
        Every agent proposal, disposition decision, and approval/rejection is
        written to an append-only, tamper-evident audit trail: events are
        chained per tenant-day (chain_hash = SHA-256(prev || event_id ||
        payload_digest || occurred_at)) and sealed batches are exported to
        Object-Lock (WORM) storage under a compliance retention window, so the
        automatic logs this article expects cannot be silently altered or
        deleted.
      evidence:
        - "services/audit-service/internal/chain/chain.go — per-tenant-per-day tamper-evidence hash chain"
        - "services/audit-service/internal/chstore/chstore.go — append-only ClickHouse audit_events store"
        - "services/audit-service/internal/worm/worm.go — Object-Lock WORM export with compliance retention"
      status: implemented
    - framework: eu_ai_act
      control_id: art_14
      control_title: "Article 14 — Human oversight"
      platform_control: >-
        Agent-proposed dispositions (prior-auth reviews, appeal outcomes)
        cannot take effect without a distinct human approver: self-approval by
        the proposing agent, or by the on-behalf-of trigger user, is rejected
        outright for high-risk proposals, and every fully autonomous proposal
        requires an explicit human principal distinct from the proposing
        agent's own identity.
      evidence:
        - "services/agent-runtime/app/proposals/service.py:_check_eligibility — four-eyes / distinct-approver invariant (ART-FR-044)"
        - "packs/insurance-claims-payer/rbac/roles.yaml — ai.proposal.approve is granted only to human reviewer roles (PA Nurse Reviewer, Medical Director, Appeals Analyst); the proposing agent never holds it"
      status: implemented
    - framework: eu_ai_act
      control_id: art_11_annex_iv
      control_title: "Article 11 / Annex IV — Technical documentation"
      platform_control: >-
        No generated EU AI Act Annex IV technical-documentation kit ships with
        this pack today. docs/brd/24_insurance_claims_payer_pack_BRD.md
        (INS-FR-083, a Should-priority requirement) specifies a
        docs/eu_ai_act/{art11,art13,art14}.md kit; it has not been authored.
        This is a documented gap, not an implemented control.
      evidence: []
      status: not_covered
    - framework: nist_ai_rmf
      control_id: govern
      control_title: >-
        GOVERN function — accountability structures & human-oversight roles
        (function-level; exact NIST subcategory numbering not asserted)
      platform_control: >-
        Distinct, named roles (e.g. Medical Director, PA Nurse Reviewer) hold
        the only approval permissions in the tenant's RBAC catalog; the
        proposing agent never holds ai.proposal.approve, and per-agent
        guardrail envelopes bound what an agent may attempt before a human
        ever sees the proposal.
      evidence:
        - "packs/insurance-claims-payer/rbac/roles.yaml — role catalog separating proposer from approver"
        - "services/agent-runtime/app/proposals/service.py:_check_eligibility"
        - "services/agent-runtime/app/domain/guardrail.py — per-agent security envelope"
      status: implemented
    - framework: nist_ai_rmf
      control_id: measure
      control_title: >-
        MEASURE function — AI system testing & evaluation (function-level;
        exact NIST subcategory numbering not asserted)
      platform_control: >-
        Model/agent changes pass through eval-service gates and canary
        rollouts before promotion, and inbound case documents are screened
        for prompt-injection signatures before being used as agent evidence,
        with detected signatures surfaced to the human approver rather than
        silently swallowed.
      evidence:
        - "services/eval-service/app/api/routes/gates.py"
        - "services/eval-service/app/api/routes/canaries.py"
        - "services/agent-runtime/app/graphs/evidence_guard.py — cross-domain prompt-injection (XPIA) detection"
      status: implemented
    - framework: nist_ai_rmf
      control_id: manage
      control_title: >-
        MANAGE function — post-deployment monitoring & incident traceability
        (function-level; exact NIST subcategory numbering not asserted)
      platform_control: >-
        The tamper-evident audit hash chain gives every proposal, decision,
        and override a durable, queryable record that supports incident
        investigation and post-deployment risk monitoring.
      evidence:
        - "services/audit-service/internal/chain/chain.go"
        - "services/audit-service/internal/chstore/chstore.go"
      status: implemented
    - framework: iso_42001
      control_id: clause_9_1
      control_title: "Clause 9.1 — Monitoring, measurement, analysis and evaluation"
      platform_control: >-
        eval-service gates and canaries continuously evaluate agent/model
        behavior against golden sets, and the audit hash chain provides the
        queryable record this clause's monitoring/measurement expectation
        needs.
      evidence:
        - "services/eval-service/app/api/routes/gates.py"
        - "services/eval-service/app/api/routes/canaries.py"
        - "services/audit-service/internal/chstore/chstore.go"
      status: implemented
    - framework: iso_42001
      control_id: clause_8_1
      control_title: "Clause 8.1 — Operational planning and control"
      platform_control: >-
        Deterministic decision tables (PA-triage / appeal-expedite routing)
        plus per-agent guardrail envelopes and the four-eyes approval gate are
        the operational controls that keep agent behavior within planned
        bounds before any governed action executes.
      evidence:
        - "packs/insurance-claims-payer/decisions/pa_review_triage.yaml"
        - "packs/insurance-claims-payer/decisions/appeal_expedite_routing.yaml"
        - "services/agent-runtime/app/domain/guardrail.py"
        - "services/agent-runtime/app/proposals/service.py:_check_eligibility"
      status: implemented
