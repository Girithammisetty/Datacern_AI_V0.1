# UM role catalog as tenant CUSTOM roles composing the Core's closed action
# catalog (rbac never mints new verbs; packctl also creates a same-named
# permission group and binds the role so it's assignable). Separation of
# duties mirrors a real UM program: nurse reviewers and the medical director
# approve agent proposals; only the medical director approves dispositions
# in bulk and model promotions; the compliance auditor reads everything and
# writes nothing.
- name: "UM Nurse Reviewer"
  actions:
    - case.case.read
    - case.case.list
    - case.case.update
    - case.disposition.read
    - case.disposition.create
    - ai.proposal.read
    - ai.proposal.list
    - ai.proposal.approve
    - ai.agent_session.read
    - ai.agent_session.create
    - ai.agent_session.execute
    - memory.memory.read
    - chart.dashboard.read
    - chart.chart.read
    - semantic.model.read
    - semantic.compile.execute
    - query.execution.read
    - query.execution.execute
    - dataset.dataset.read
    - notification.inbox.read
- name: "Medical Director"
  actions:
    - case.case.read
    - case.case.list
    - case.case.update
    - case.case.assign
    - case.disposition.read
    - case.disposition.create
    - case.disposition.update
    - case.disposition.approve
    - case.bulk.approve
    - ai.proposal.read
    - ai.proposal.list
    - ai.proposal.approve
    - ai.agent_session.read
    - ai.agent_session.create
    - ai.agent_session.execute
    - memory.memory.read
    - chart.dashboard.read
    - chart.chart.read
    - semantic.model.read
    - semantic.compile.execute
    - query.execution.read
    - query.execution.execute
    - dataset.dataset.read
    - experiment.promotion.read
    - experiment.promotion.approve
    - notification.inbox.read
