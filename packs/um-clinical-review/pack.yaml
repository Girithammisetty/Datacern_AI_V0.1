deferred:
  - kind: agent_recipes
    reason: >-
      Bespoke LangGraph recipes for the chart-reader / criteria-matcher /
      determination-drafter agent chain require agent-runtime graph-module
      registration (a Core code surface), and page-anchored OCR extraction
      over scanned clinical attachments additionally requires a
      document-intelligence capability Core does not ship yet (BRD 76 §9).
      This pack specializes the existing case-triage + analytics agents via
      TenantAgentConfig prompt_params + tenant-scope RAG grounding instead;
      the proposal-mode + four-eyes guarantees the recipes would need are
      ALREADY enforced by agent-runtime for the existing agents.
