# Governed model blueprints (experiment-service inc9): the intended model
# this vertical runs, independent of any trained artifact. It corresponds to
# the training pipeline this pack ships (pipelines/templates.yaml), so the
# blueprint and its implementation stay in one governed pair.
- archetype_key: um_determination_outcome_scorer
  name: "UM determination outcome scorer"
  task_type: classification
  target: decision
  description: >-
    Supervised scorer over the tenant's decided review history
    (um-determinations): predicts the likely approve/deny/partial outcome
    from line of business, review type, and procedure — used to ORDER the
    review worklist (route likely-clean approvals to fast confirmation,
    likely-complex cases to senior reviewers early) and to calibrate
    shadow-mode agreement before any queue goes assisted-live. Implemented by
    the pack's xgboost training pipeline.
  expected_metrics: { f1: 0.80 }
  governance_notes: >-
    Adverse-determination relevant: scores inform review ordering only — a
    denial of care is never issued by the model, and every adverse
    determination carries documented findings from a qualified human
    clinical reviewer (CMS 2024 MA rule, per this pack's grounding).
    Promotion requires eval-gate + four-eyes medical-director approval.
