# Domain ontology (dataset-service inc11): the entity TYPES this vertical
# operates on and their typed relationships — the type-level model behind the
# um-review-cases / um-case-documents / um-policy-catalog / um-determinations
# binding contracts. Attribute names match the contract columns so the
# ontology describes data that actually lands.
- entity_key: member
  name: Member
  description: "The covered plan member whose requested care is under utilization review."
  attributes:
    - { name: member_id, data_type: string }
  relationships:
    - { name: review_cases, target: review_case, cardinality: has_many }
- entity_key: provider
  name: Provider
  description: "The requesting/rendering provider (NPI-identified) submitting review requests and clinical documentation."
  attributes:
    - { name: provider_npi, data_type: string }
  relationships:
    - { name: review_cases, target: review_case, cardinality: has_many }
- entity_key: review_case
  name: "UM review case"
  description: >-
    One utilization management review: a requested service reviewed for
    medical necessity against the governing criteria for its line of
    business, on a plan-configured regulatory clock.
  attributes:
    - { name: lob, data_type: string, description: "commercial_fi | commercial_aso | medicare | medicaid" }
    - { name: review_type, data_type: string, description: "preservice | concurrent | retrospective" }
    - { name: urgency, data_type: string, description: "standard | urgent" }
    - { name: requested_service, data_type: string }
    - { name: cpt_code, data_type: string }
    - { name: icd10_code, data_type: string }
    - { name: status, data_type: string, description: "pending | approved | denied | withdrawn" }
    - { name: turnaround_hours, data_type: float }
    - { name: window_hours, data_type: float, description: "plan-configured regulatory decision window" }
    - { name: clinical_info_status, data_type: string, description: "complete | incomplete" }
    - { name: criteria_source, data_type: string, description: "mcg | interqual | internal_policy | cms_ncd_lcd | state_medicaid" }
    - { name: agent_recommendation, data_type: string, description: "approve | refer_md | request_info" }
    - { name: agent_confidence, data_type: float }
  relationships:
    - { name: member, target: member, cardinality: belongs_to }
    - { name: provider, target: provider, cardinality: belongs_to }
    - { name: policy, target: medical_policy, cardinality: belongs_to }
    - { name: documents, target: clinical_document, cardinality: has_many }
    - { name: determination, target: determination, cardinality: has_one }
- entity_key: clinical_document
  name: "Clinical document"
  description: >-
    One inbound document attached to a review (chart notes, imaging report,
    therapy history) with its intake channel, OCR state, and whether it
    actually contains clinical content for the request.
  attributes:
    - { name: doc_type, data_type: string }
    - { name: source_channel, data_type: string, description: "portal | fax | sftp | mail" }
    - { name: page_count, data_type: integer }
    - { name: ocr_status, data_type: string, description: "ok | failed | pending" }
    - { name: contains_clinicals, data_type: string, description: "yes | no" }
    - { name: classification_confidence, data_type: float }
  relationships:
    - { name: review_case, target: review_case, cardinality: belongs_to }
- entity_key: medical_policy
  name: "Medical policy / guideline"
  description: >-
    The governing coverage criteria for a service: a licensed guideline
    (MCG/InterQual-class), an internal plan medical policy, a CMS NCD/LCD,
    or a state Medicaid manual provision — with its digitization state
    toward executable criteria.
  attributes:
    - { name: policy_title, data_type: string }
    - { name: criteria_source, data_type: string }
    - { name: lob_scope, data_type: string }
    - { name: effective_month, data_type: string }
    - { name: digitized, data_type: string, description: "yes | no" }
    - { name: procedure_code_count, data_type: integer }
  relationships:
    - { name: review_cases, target: review_case, cardinality: has_many }
- entity_key: determination
  name: Determination
  description: >-
    The signed human decision on a review — who decided (nurse or physician),
    the outcome, the elapsed clock, and any downstream appeal outcome (the
    calibration signal for shadow-mode agreement).
  attributes:
    - { name: decision, data_type: string, description: "approved | denied | partially_approved" }
    - { name: decided_by_role, data_type: string, description: "rn | md" }
    - { name: decision_month, data_type: string }
    - { name: turnaround_hours, data_type: float }
    - { name: appeal_filed, data_type: string, description: "yes | no" }
    - { name: appeal_outcome, data_type: string, description: "upheld | overturned | na" }
  relationships:
    - { name: review_case, target: review_case, cardinality: belongs_to }
